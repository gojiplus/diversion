[project]
name = "diversion"
version = "0.1.0"
description = "Plan city walks with sightseeing stops and a clear walking-time budget."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood" }]
keywords = ["routes", "maps", "streamlit", "travel", "points-of-interest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "streamlit>=1.66",
    "requests>=2.32",
    "polyline>=2",
    "openai>=2",
    "python-dotenv>=1.1",
]

[project.urls]
Homepage = "https://github.com/gojiplus/diversion"
Repository = "https://github.com/gojiplus/diversion"
Documentation = "https://gojiplus.github.io/diversion/"
Issues = "https://github.com/gojiplus/diversion/issues"
Changelog = "https://github.com/gojiplus/diversion/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.12.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF",
    "PTH", "RET", "PIE", "FURB", "PERF", "DTZ", "LOG", "G", "TC", "FLY",
    "RSE", "SLOT", "FA", "A", "EXE", "ICN", "PGH", "PLE", "ARG", "SLF",
]
# D203/D213: the google convention the fleet standard picks. W191/D206/D300:
# ruff's own docs list these as always incompatible with `ruff format`, which
# the standard also runs.
ignore = ["D203", "D213", "W191", "D206", "D300"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "ARG", "SLF"]
"docs/**" = ["D"]

[tool.pyright]
include = ["src", "app.py", "tests"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[dependency-groups]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]
dev = ["ruff>=0.14", "pyright>=1.1.390", "pre-commit>=4", { include-group = "test" }]
test = ["pytest>=8", "pytest-cov>=6"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
log_level = "INFO"
xfail_strict = true
filterwarnings = ["error"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.coverage.run]
source = ["diversion"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.preen]
# This endpoint requires authenticated POST requests, not a link checker's GET.
link_ignore = ['^https://routes[.]googleapis[.]com/directions/v2:computeRoutes$']

[tool.codespell]
builtin = "clear,rare,en-GB_to_en-US"
