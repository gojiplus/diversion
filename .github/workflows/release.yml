name: Release build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: gojiplus/py-canon/.github/workflows/reusable-release.yml@v1
    permissions:
      contents: write
      id-token: write
    with:
      github-release: false
